<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anshi · automation & systems</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #f7f2e8;
      --cream: #efe8d6;
      --parchment: #e4d9c3;
      --sage-light: #c8d5b9;
      --sage: #8aab7a;
      --sage-dark: #5e8050;
      --moss: #4a6741;
      --moss-dark: #344d2f;
      --dusty-rose: #c9897a;
      --dusty-rose-light: #deb8ae;
      --warm-brown: #6b4f3a;
      --text-dark: #2e2318;
      --text-mid: #5c4433;
      --text-light: #8a6f5a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--ivory);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── BACKGROUND (unchanged) ── */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(
        180deg,
        #f0ebe0 0%,
        #e8e0ce 40%,
        #ddd5bf 70%,
        #cdd8b8 100%
      );
    }
    .hill {
      position: absolute;
      border-radius: 50%;
      opacity: 0.55;
    }
    .hill-1 {
      width: 180%; height: 420px;
      background: radial-gradient(ellipse at 50% 100%, #b8cda0 0%, transparent 70%);
      bottom: -60px; left: -40%;
    }
    .hill-2 {
      width: 140%; height: 320px;
      background: radial-gradient(ellipse at 50% 100%, #a8bf90 0%, transparent 70%);
      bottom: 20px; left: -20%;
      opacity: 0.4;
    }
    .hill-3 {
      width: 100%; height: 260px;
      background: radial-gradient(ellipse at 50% 100%, #c8d5a8 0%, transparent 70%);
      bottom: 60px; left: 0;
      opacity: 0.35;
    }
    .sky-glow {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 55%;
      background: radial-gradient(ellipse at 60% 30%, rgba(255,235,200,0.45) 0%, transparent 65%),
                  radial-gradient(ellipse at 20% 20%, rgba(220,195,170,0.3) 0%, transparent 50%);
    }
    .botanicals {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .leaf {
      position: absolute;
      opacity: 0;
      animation: floatLeaf linear infinite;
      font-size: 18px;
      filter: drop-shadow(0 2px 4px rgba(60,80,40,0.2));
    }
    @keyframes floatLeaf {
      0%   { transform: translateY(0) rotate(0deg) translateX(0px); opacity: 0; }
      5%   { opacity: 0.75; }
      20%  { transform: translateY(-22vh) rotate(45deg) translateX(18px); }
      40%  { transform: translateY(-44vh) rotate(90deg) translateX(-14px); }
      60%  { transform: translateY(-66vh) rotate(180deg) translateX(20px); }
      80%  { transform: translateY(-88vh) rotate(270deg) translateX(-10px); opacity: 0.6; }
      95%  { opacity: 0.2; }
      100% { transform: translateY(-112vh) rotate(360deg) translateX(8px); opacity: 0; }
    }
    .scene-deco {
      position: absolute;
      pointer-events: none;
      font-size: 32px;
      opacity: 0.55;
      filter: drop-shadow(0 4px 8px rgba(60,80,40,0.15));
    }
    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* ── LAYOUT ── */
    .container {
      position: relative;
      z-index: 2;
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero { text-align: center; margin-bottom: 10px; animation: fadeDown 0.8s ease both; }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    .hero-star { font-size: 52px; display: block; margin-bottom: 12px; filter: drop-shadow(0 4px 12px rgba(180,120,60,0.3)); animation: starBob 3s ease-in-out infinite; }
    @keyframes starBob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }

    .window {
      width: 100%;
      background: rgba(247, 242, 232, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(200, 185, 160, 0.7);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(60, 45, 25, 0.12), 0 2px 8px rgba(60, 45, 25, 0.08), inset 0 1px 0 rgba(255,255,255,0.6);
      overflow: hidden;
      animation: fadeUp 0.8s 0.1s ease both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .window-header {
      background: linear-gradient(180deg, var(--parchment) 0%, #d8cdb5 100%);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(180,160,130,0.5);
    }
    .win-btn { width: 13px; height: 13px; border-radius: 50%; border: none; flex-shrink: 0; cursor: pointer; }
    .win-close { background: #d4776a; }
    .win-min   { background: #d4b46a; }
    .win-max   { background: var(--sage); }
    .window-title {
      flex: 1;
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      color: var(--text-mid);
      margin-right: 39px;
    }

    .home-content { padding: 48px 28px 40px; text-align: center; }
    .home-title { font-family: 'Playfair Display', serif; font-size: 48px; line-height: 1.1; margin-bottom: 12px; color: var(--text-dark); letter-spacing: -0.02em; }
    .home-title em { font-style: italic; color: var(--dusty-rose); }
    .home-subtitle { font-size: 15px; color: var(--text-light); letter-spacing: 0.05em; margin-bottom: 48px; font-weight: 600; }

    .nav-icons { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .nav-icon-btn {
      display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; background: none; border: none; font-family: 'Nunito', sans-serif; transition: transform 0.2s ease; padding: 4px 8px;
    }
    .nav-icon-btn:hover { transform: translateY(-4px); }
    .nav-icon-btn:hover .icon-circle { background: var(--sage); border-color: var(--sage-dark); }
    .nav-icon-btn:hover .icon-circle svg { stroke: white; }
    .nav-icon-btn:hover .icon-label { color: var(--moss); }
    .nav-icon-btn.active .icon-circle { background: var(--sage); border-color: var(--sage-dark); box-shadow: 0 4px 12px rgba(90,128,80,0.35); }
    .nav-icon-btn.active .icon-circle svg { stroke: white; }
    .nav-icon-btn.active .icon-label { color: var(--moss); font-weight: 800; }

    .icon-circle {
      width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--parchment); background: rgba(247,242,232,0.7); display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(60,45,25,0.1);
    }
    .icon-circle svg { width: 26px; height: 26px; stroke: var(--text-mid); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s; }
    .icon-label { font-size: 12px; font-weight: 700; color: var(--text-light); letter-spacing: 0.04em; transition: color 0.2s; }

    .grass-strip {
      width: 100%; height: 28px; background: linear-gradient(180deg, transparent 0%, rgba(140,175,110,0.18) 100%); border-top: 1.5px solid rgba(140,175,110,0.3); display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 16px; opacity: 0.7; letter-spacing: 6px;
    }

    /* ── MODAL OVERLAY ── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100; background: rgba(40, 30, 15, 0.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; animation: backdropIn 0.3s ease both;
    }
    .modal-backdrop.visible { display: flex; }
    @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }

    /* ── SCROLLABLE MODAL WINDOW ── */
    .section-window {
      width: 100%;
      max-width: 860px;
      max-height: 98vh;
      background: rgba(247, 242, 232, 0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(200, 185, 160, 0.8);
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(60,45,25,0.28), 0 4px 16px rgba(60,45,25,0.15);
      overflow-y: auto;
      animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.88) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .section-body {
      padding: 20px 32px 24px;
      overflow: visible;
    }

    .section-label {
      font-size: 9px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage-dark); margin: 16px 0 6px; display: flex; align-items: center; gap: 8px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--sage-light); }

    hr { border: none; border-top: 1px solid var(--parchment); margin: 12px 0; }
    a { color: var(--sage-dark); text-decoration: none; font-weight: 700; }
    a:hover { color: var(--dusty-rose); text-decoration: underline; }

    p { font-size: 15px; line-height: 1.6; margin-bottom: 8px; color: var(--text-dark); }
    ul { padding-left: 22px; font-size: 15px; line-height: 1.7; margin: 4px 0; color: var(--text-dark); }

    .about-header { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 12px; }
    .about-avatar { width: 70px; height: 70px; border-radius: 18px; background: linear-gradient(135deg, var(--sage) 0%, var(--dusty-rose) 100%); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; box-shadow: 0 4px 14px rgba(90,128,80,0.25); }
    .about-name { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; }
    .about-name-role { font-size: 13px; color: var(--text-light); margin-top: 4px; line-height: 1.4; }

    .tools-grid { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .tool-tag { background: rgba(200,213,185,0.4); border: 1px solid var(--sage-light); border-radius: 30px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--moss); }

    /* why me grid – compact */
    .why-grid { display: flex; flex-direction: column; gap: 8px; margin: 6px 0; }
    .why-item { background: rgba(200,213,185,0.2); border-left: 5px solid var(--sage); padding: 8px 14px; border-radius: 0 14px 14px 0; }
    .why-num { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 800; color: var(--sage-dark); display: block; line-height: 1; margin-bottom: 2px; }
    .why-item strong { font-size: 15px; display: block; margin-bottom: 2px; color: var(--moss-dark); }
    .why-item p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--text-mid); }

    /* interest grid – clean similar style */
    .interest-grid { display: flex; flex-direction: column; gap: 12px; margin: 12px 0; }
    .interest-item { background: rgba(200,213,185,0.15); border-radius: 16px; padding: 12px 16px; border: 1px solid var(--sage-light); }
    .interest-item h3 { font-size: 16px; font-weight: 800; color: var(--moss-dark); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .interest-item p { font-size: 14px; line-height: 1.5; color: var(--text-mid); margin: 0; }

    .contact-section { text-align: center; }
    .email-box { background: rgba(200,213,185,0.25); border: 1.5px solid var(--sage-light); border-radius: 18px; padding: 20px 20px; margin: 12px 0; }
    .email-icon { font-size: 48px; margin-bottom: 8px; }
    .email-address { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; margin-bottom: 10px; color: var(--moss-dark); word-break: break-all; }
    .email-btn { display: inline-block; background: var(--dusty-rose); color: white; padding: 10px 24px; border-radius: 40px; font-weight: 700; text-decoration: none; transition: background 0.2s; }
    .email-btn:hover { background: #b57060; }

    .footer { margin-top: 32px; text-align: center; animation: fadeUp 0.8s 0.3s ease both; }
    .footer-copy { font-size: 12px; color: var(--text-light); }
  </style>
</head>

};

let currentSection = null;

function showSection(name) {
  currentSection = name;
  document.querySelectorAll('.nav-icon-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('nav-' + name);
  if (btn) btn.classList.add('active');
  // set window title
  let displayName = name;
  if (name === 'why') displayName = 'why me?';
  else if (name === 'interest') displayName = 'interest';
  document.getElementById('section-title').textContent = displayName;
  document.getElementById('section-content').innerHTML = templates[name];
  const backdrop = document.getElementById('modal-backdrop');
  backdrop.classList.add('visible');
  const sw = document.getElementById('section-window');
  sw.style.animation = 'none';
  sw.offsetHeight;
  sw.style.animation = '';
  sw.scrollTop = 0; // reset scroll
}

function closeSection() {
  document.getElementById('modal-backdrop').classList.remove('visible');
  document.querySelectorAll('.nav-icon-btn').forEach(b => b.classList.remove('active'));
  currentSection = null;
}

function handleBackdropClick(e) {
  if (e.target === document.getElementById('modal-backdrop')) closeSection();
}
</script>
</body>
</html>
